<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Browsers fetch the favicon on every page, so it points at the small
         mark. The 512px file is only needed where something large is wanted. -->
    <link rel="icon" type="image/png" href="/logo-mark.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#13161b" />
    <meta name="color-scheme" content="dark" />

    <link rel="preconnect" href="https://assets.embsucf.org" crossorigin />
    <!-- Calendar is fetched after mount; resolve the host ahead of time. -->
    <link rel="dns-prefetch" href="https://www.googleapis.com" />

    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
